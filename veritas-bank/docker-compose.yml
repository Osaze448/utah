version: '3.8'

services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: veritas-oracle-db
    ports:
      - "1521:1521"
    environment:
      # Administrative password for SYS, SYSTEM, and PDBADMIN
      - ORACLE_PWD=VeritasDB@2024
    volumes:
      - oracle_data:/opt/oracle/oradata
      # Mount sql schema init script to official Oracle container startup scripts directory
      - ./database/sql:/opt/oracle/scripts/startup
    restart: always
    healthcheck:
      # Official Oracle container DB status health check script
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veritas-backend-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - ORACLE_USER=veritas_admin
      - ORACLE_PASSWORD=VeritasDB@2024
      - ORACLE_HOST=oracle-db
      - ORACLE_PORT=1521
      - ORACLE_SERVICE=FREEPDB1  # Official 23c Free Pluggable Database (PDB) service name
      - JWT_SECRET_KEY=veritas-super-secret-jwt-key-2024-enterprise
    depends_on:
      oracle-db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: always

volumes:
  oracle_data:
